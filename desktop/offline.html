<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Life OS — Offline</title>
    <style>
      html, body { height: 100%; margin: 0; font-family: system-ui, sans-serif; background: #09090b; color: #fafafa; }
      body { display: flex; align-items: center; justify-content: center; }
      .box { max-width: 22rem; padding: 1.5rem; text-align: center; }
      p { color: #a1a1aa; line-height: 1.5; }
      button { margin-top: 1rem; padding: 0.6rem 1rem; border: 0; border-radius: 0.6rem; background: #fafafa; color: #09090b; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>You’re offline</h1>
      <p>Open Life OS once while online so the app can cache. After that, it should load without the network.</p>
      <button type="button" id="retry">Retry</button>
    </div>
    <script>
      const TARGET = 'https://progress.fahadshahbaz.fun/';
      document.getElementById('retry').onclick = () => { location.replace(TARGET); };
      setTimeout(() => { location.replace(TARGET); }, 2500);
    </script>
  </body>
</html>
